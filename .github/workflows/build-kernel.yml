name: build-sky-kernel
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses5-dev x11proto-core-dev libx11-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 bc cpio rsync libssl-dev libelf-dev dwarves lz4
          mkdir -p /home/runner/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > /home/runner/bin/repo
          chmod +x /home/runner/bin/repo
      - name: Fetch Android common kernel 5.10 (2026-10 release)
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          git config --global color.ui false
          mkdir -p /home/runner/k && cd /home/runner/k
          /home/runner/bin/repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10-2026-10 --depth=1 < /dev/null || /home/runner/bin/repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10 --depth=1 < /dev/null
          /home/runner/bin/repo sync -c -j8 --no-tags --no-clone-bundle
          df -h /
      - name: Apply the phone's own config plus the extra options
        run: |
          cd /home/runner/k/common
          if [ -f "$GITHUB_WORKSPACE/config.gz" ]; then
            zcat "$GITHUB_WORKSPACE/config.gz" > arch/arm64/configs/gki_defconfig
            echo "using the phone config"
          else
            echo "no config.gz in the repo, using the stock gki_defconfig"
          fi
          cat >> arch/arm64/configs/gki_defconfig <<'EOC'
          CONFIG_DEVTMPFS=y
          CONFIG_FHANDLE=y
          CONFIG_AUTOFS_FS=y
          CONFIG_AUTOFS4_FS=y
          CONFIG_CRYPTO_USER_API=y
          CONFIG_CRYPTO_USER_API_HASH=y
          CONFIG_FANOTIFY=y
          CONFIG_SQUASHFS=y
          CONFIG_SQUASHFS_XZ=y
          CONFIG_SQUASHFS_ZSTD=y
          EOC
          sed -i 's/^ *//' arch/arm64/configs/gki_defconfig
          sed -i 's/check_defconfig//' build.config.gki
          grep -c 'CONFIG_DEVTMPFS=y' arch/arm64/configs/gki_defconfig
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          free -h
      - name: Build
        shell: bash
        run: |
          cd /home/runner/k
          export LTO=thin
          export BUILD_CONFIG=common/build.config.gki.aarch64
          build/build.sh > /home/runner/build.log 2>&1 || { echo BUILD_FAILED; tail -n 40 /home/runner/build.log; exit 1; }
          ls -la out/*/dist | head -40
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /home/runner/build.log
          if-no-files-found: warn
      - name: Check the result
        run: |
          cd /home/runner/k/out/*/common
          grep -E '^CONFIG_(DEVTMPFS|FHANDLE|AUTOFS_FS|SQUASHFS|FANOTIFY|MODVERSIONS|CFI_CLANG)=' .config || true
          strings -a arch/arm64/boot/Image | grep -m1 'Linux version' || true
      - uses: actions/upload-artifact@v4
        with:
          name: sky-kernel
          path: |
            /home/runner/k/out/*/dist/Image
            /home/runner/k/out/*/dist/Image.lz4
            /home/runner/k/out/*/dist/Image.gz
            /home/runner/k/out/*/dist/System.map
            /home/runner/k/out/*/common/.config
          if-no-files-found: warn
